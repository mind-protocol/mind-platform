<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$MIND — Swap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            padding: 20px;
        }
        .card {
            background: #141420;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 24px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            color: #888;
        }
        .price-line {
            text-align: center;
            font-size: 14px;
            color: #6ae;
            margin-bottom: 20px;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 8px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .input-row {
            display: flex;
            align-items: center;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .input-row input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            outline: none;
            font-family: inherit;
        }
        .input-row input::placeholder { color: #444; }
        .token-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #252540;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .token-badge img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .arrow {
            text-align: center;
            font-size: 20px;
            margin: -4px 0;
            color: #555;
        }
        .output-amount {
            font-size: 20px;
            color: #6f6;
            font-weight: 600;
        }
        .output-note {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5b6cf7, #8b5cf6);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-connect {
            background: #252540;
            color: #aaf;
            border: 1px solid #3a3a5a;
        }
        .btn-connect:hover { background: #303050; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .status.error { display: block; background: #2a1020; color: #f66; border: 1px solid #522; }
        .status.success { display: block; background: #102a10; color: #6f6; border: 1px solid #252; }
        .status.info { display: block; background: #10102a; color: #6af; border: 1px solid #225; }
        .status a { color: inherit; }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            padding: 4px 0;
        }
        .info-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1f1f2f;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
        .footer a { color: #6ae; text-decoration: none; }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #555;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .wallet-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .wallet-info .addr { color: #6ae; font-family: monospace; }
        .wallet-info .disconnect {
            color: #f66;
            cursor: pointer;
            font-size: 12px;
        }
        .presets {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .presets button {
            flex: 1;
            padding: 6px;
            background: #1f1f2f;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .presets button:hover { background: #252540; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>$MIND</h1>
                <p>Mind Protocol — Token-2022</p>
            </div>

            <div id="price-line" class="price-line">Loading price...</div>

            <div id="wallet-section"></div>

            <div class="input-group">
                <label>
                    <span>You pay</span>
                    <span id="sol-balance"></span>
                </label>
                <div class="input-row">
                    <input type="number" id="sol-input" placeholder="0.0" step="0.01" min="0.01">
                    <div class="token-badge">
                        <img src="https://raw.githubusercontent.com/solana-labs/token-list/main/assets/mainnet/So11111111111111111111111111111111111111112/logo.png" alt="SOL">
                        SOL
                    </div>
                </div>
                <div class="presets">
                    <button onclick="setAmount(0.1)">0.1</button>
                    <button onclick="setAmount(0.5)">0.5</button>
                    <button onclick="setAmount(1)">1</button>
                    <button onclick="setAmount(5)">5</button>
                </div>
            </div>

            <div class="arrow">↓</div>

            <div class="input-group">
                <label>
                    <span>You receive (estimated)</span>
                    <span>1% transfer fee</span>
                </label>
                <div class="input-row">
                    <span id="mind-output" class="output-amount">—</span>
                    <div class="token-badge">
                        <img src="https://mindprotocol.ai/mind-token.png" alt="MIND" onerror="this.style.display='none'">
                        MIND
                    </div>
                </div>
                <div class="output-note" id="output-note"></div>
            </div>

            <div id="action-section">
                <button class="btn btn-connect" id="connect-btn" onclick="connectWallet()">
                    Connect Wallet
                </button>
            </div>

            <div id="status" class="status"></div>

            <div class="info-section">
                <div class="info-row">
                    <span>Pool</span>
                    <span>FluxBeam (Token-2022)</span>
                </div>
                <div class="info-row">
                    <span>LP Lock</span>
                    <span>100% locked until Feb 2027</span>
                </div>
                <div class="info-row">
                    <span>Transfer Fee</span>
                    <span>1% (protocol fee)</span>
                </div>
                <div class="info-row">
                    <span>Contract</span>
                    <span style="font-family: monospace; font-size: 10px;">EgLGfRrjX3...Bm6p</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="https://mindprotocol.ai">mindprotocol.ai</a> ·
            <a href="https://solscan.io/token/EgLGfRrjX3du7Pwbj8dzyubSk8ic1WdDfq1ysLqhBm6p">Solscan</a> ·
            <a href="https://t.me/mindprotocol_ai">Telegram</a>
        </div>
    </div>

    <script src="https://unpkg.com/buffer@6.0.3/index.js"></script>
    <script>window.Buffer = window.Buffer || buffer.Buffer;</script>
    <script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
    <script>
        const MIND_MINT = 'EgLGfRrjX3du7Pwbj8dzyubSk8ic1WdDfq1ysLqhBm6p';
        const SOL_MINT = 'So11111111111111111111111111111111111111112';
        const WSOL_MINT = SOL_MINT;
        const RPC = 'https://mainnet.helius-rpc.com/?api-key=4c3a5fc2-ea3f-45eb-85d5-2f282a6b4401';
        const FLUXBEAM_API = 'https://api.fluxbeam.xyz/v1';
        const TOKEN_PROGRAM = 'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA';
        const ASSOC_TOKEN_PROGRAM = 'ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL';

        let connection = null;
        let wallet = null;
        let quoteTimeout = null;
        let currentQuote = null;

        // Initialize
        async function init() {
            connection = new solanaWeb3.Connection(RPC, 'confirmed');
            await fetchPrice();
            setInterval(fetchPrice, 30000);
        }

        async function fetchPrice() {
            try {
                const r = await fetch(`${FLUXBEAM_API}/quote?inputMint=${SOL_MINT}&outputMint=${MIND_MINT}&amount=1000000000`);
                const d = await r.json();
                if (d.quote) {
                    const mindPerSol = d.quote.outAmount / 1e9;
                    // Estimate USD: we know 1 MIND ≈ $0.20 from pool setup
                    const pricePerMind = 1.0 / mindPerSol; // in SOL
                    document.getElementById('price-line').textContent =
                        `1 SOL = ${mindPerSol.toFixed(2)} MIND · ~$${(pricePerMind * 87).toFixed(4)}/MIND`;
                }
            } catch (e) {
                document.getElementById('price-line').textContent = 'Price unavailable';
            }
        }

        function setAmount(val) {
            document.getElementById('sol-input').value = val;
            getQuote();
        }

        // Quote with debounce
        document.getElementById('sol-input').addEventListener('input', () => {
            clearTimeout(quoteTimeout);
            quoteTimeout = setTimeout(getQuote, 500);
        });

        async function getQuote() {
            const solAmount = parseFloat(document.getElementById('sol-input').value);
            if (!solAmount || solAmount <= 0) {
                document.getElementById('mind-output').textContent = '—';
                document.getElementById('output-note').textContent = '';
                currentQuote = null;
                return;
            }

            document.getElementById('mind-output').textContent = '...';
            try {
                const lamports = Math.floor(solAmount * 1e9);
                const r = await fetch(`${FLUXBEAM_API}/quote?inputMint=${SOL_MINT}&outputMint=${MIND_MINT}&amount=${lamports}`);
                const d = await r.json();
                if (d.quote) {
                    currentQuote = d.quote;
                    const mindAmount = d.quote.outAmount / 1e9;
                    const afterFee = mindAmount * 0.99; // 1% transfer fee
                    document.getElementById('mind-output').textContent = afterFee.toFixed(2);
                    document.getElementById('output-note').textContent =
                        `${mindAmount.toFixed(2)} MIND - 1% fee = ${afterFee.toFixed(2)} MIND received`;
                }
            } catch (e) {
                document.getElementById('mind-output').textContent = 'Error';
                currentQuote = null;
            }
        }

        async function connectWallet() {
            const statusEl = document.getElementById('status');
            try {
                // Check for Phantom or any Solana wallet
                const provider = window.phantom?.solana || window.solana;
                if (!provider) {
                    statusEl.className = 'status error';
                    statusEl.innerHTML = 'No Solana wallet found. Install <a href="https://phantom.app" target="_blank">Phantom</a> or <a href="https://solflare.com" target="_blank">Solflare</a>.';
                    return;
                }

                statusEl.className = 'status info';
                statusEl.textContent = 'Connecting...';

                const resp = await provider.connect();
                wallet = provider;
                const pubkey = resp.publicKey.toString();

                // Update UI
                document.getElementById('wallet-section').innerHTML = `
                    <div class="wallet-info">
                        <span class="addr">${pubkey.slice(0, 4)}...${pubkey.slice(-4)}</span>
                        <span class="disconnect" onclick="disconnectWallet()">Disconnect</span>
                    </div>
                `;

                // Show swap button
                document.getElementById('action-section').innerHTML = `
                    <button class="btn btn-primary" id="swap-btn" onclick="executeSwap()">
                        Swap SOL → MIND
                    </button>
                `;

                // Get SOL balance
                const bal = await connection.getBalance(resp.publicKey);
                document.getElementById('sol-balance').textContent = `Balance: ${(bal / 1e9).toFixed(4)} SOL`;

                statusEl.className = 'status';
                statusEl.style.display = 'none';

            } catch (e) {
                statusEl.className = 'status error';
                statusEl.textContent = e.message || 'Failed to connect wallet';
            }
        }

        function disconnectWallet() {
            if (wallet) wallet.disconnect();
            wallet = null;
            document.getElementById('wallet-section').innerHTML = '';
            document.getElementById('action-section').innerHTML = `
                <button class="btn btn-connect" onclick="connectWallet()">Connect Wallet</button>
            `;
            document.getElementById('sol-balance').textContent = '';
        }

        function setStatus(type, msg) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.innerHTML = msg;
        }

        // Get Associated Token Address (deterministic PDA)
        function getATA(owner, mint, programId) {
            const ownerPk = new solanaWeb3.PublicKey(owner);
            const mintPk = new solanaWeb3.PublicKey(mint);
            const tokenProg = new solanaWeb3.PublicKey(programId || TOKEN_PROGRAM);
            const assocProg = new solanaWeb3.PublicKey(ASSOC_TOKEN_PROGRAM);

            const [ata] = solanaWeb3.PublicKey.findProgramAddressSync(
                [ownerPk.toBuffer(), tokenProg.toBuffer(), mintPk.toBuffer()],
                assocProg
            );
            return ata;
        }

        async function executeSwap() {
            if (!wallet) return;
            const solAmount = parseFloat(document.getElementById('sol-input').value);
            if (!solAmount || solAmount <= 0) {
                setStatus('error', 'Enter an amount of SOL to swap');
                return;
            }

            const btn = document.getElementById('swap-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Preparing swap...';

            try {
                const pubkey = wallet.publicKey;

                // Step 1: Ensure WSOL ATA exists and is funded
                setStatus('info', '<span class="spinner"></span> Step 1/3: Setting up WSOL account...');

                const wsolAta = getATA(pubkey.toString(), WSOL_MINT);
                const lamports = Math.floor(solAmount * 1e9);
                const extraBuffer = 20_000_000; // 0.02 SOL buffer for rent + gas

                const wsolInfo = await connection.getAccountInfo(wsolAta);
                const needsCreate = !wsolInfo;
                const currentBalance = wsolInfo ? wsolInfo.lamports - 2039280 : 0; // subtract rent
                const needsFund = currentBalance < lamports;

                if (needsCreate || needsFund) {
                    const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                    const fundTx = new solanaWeb3.Transaction();
                    fundTx.recentBlockhash = blockhash;
                    fundTx.feePayer = pubkey;

                    if (needsCreate) {
                        // Create WSOL ATA (idempotent)
                        fundTx.add(
                            createATAInstruction(pubkey, wsolAta, pubkey, WSOL_MINT)
                        );
                    }

                    // Transfer SOL into WSOL ATA
                    const fundAmount = lamports + (needsCreate ? 2039280 : 0) + 10000; // rent + safety margin
                    fundTx.add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: pubkey,
                            toPubkey: wsolAta,
                            lamports: fundAmount,
                        })
                    );

                    // Sync native SOL as WSOL
                    fundTx.add(syncNativeInstruction(wsolAta));

                    setStatus('info', '<span class="spinner"></span> Approve WSOL setup transaction in your wallet...');
                    const signed = await wallet.signTransaction(fundTx);
                    const fundSig = await connection.sendRawTransaction(signed.serialize());
                    await connection.confirmTransaction({
                        signature: fundSig,
                        blockhash,
                        lastValidBlockHeight
                    }, 'confirmed');
                    setStatus('info', '<span class="spinner"></span> WSOL funded! Getting swap quote...');
                }

                // Step 2: Get fresh quote and swap transaction
                btn.innerHTML = '<span class="spinner"></span> Getting quote...';
                setStatus('info', '<span class="spinner"></span> Step 2/3: Getting swap transaction...');

                const qr = await fetch(`${FLUXBEAM_API}/quote?inputMint=${SOL_MINT}&outputMint=${MIND_MINT}&amount=${lamports}`);
                const qd = await qr.json();
                if (!qd.quote) throw new Error('No quote available. Try again.');

                const sr = await fetch(`${FLUXBEAM_API}/swap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quote: qd.quote,
                        userPublicKey: pubkey.toString(),
                    })
                });
                const sd = await sr.json();
                if (!sd.transaction) throw new Error('Swap transaction failed: ' + JSON.stringify(sd));

                // Step 3: Fix and sign swap transaction
                btn.innerHTML = '<span class="spinner"></span> Sign swap...';
                setStatus('info', '<span class="spinner"></span> Step 3/3: Approve swap in your wallet...');

                const txBuf = Uint8Array.from(atob(sd.transaction), c => c.charCodeAt(0));
                const fixedBuf = fixFluxBeamTx(txBuf);

                const tx = solanaWeb3.VersionedTransaction.deserialize(fixedBuf);
                const { blockhash: bh2, lastValidBlockHeight: lv2 } = await connection.getLatestBlockhash('confirmed');
                tx.message.recentBlockhash = bh2;

                const signedSwap = await wallet.signTransaction(tx);
                const swapSig = await connection.sendRawTransaction(signedSwap.serialize(), {
                    skipPreflight: true,
                    maxRetries: 5,
                });

                setStatus('info', '<span class="spinner"></span> Confirming transaction...');
                const confirmation = await connection.confirmTransaction({
                    signature: swapSig,
                    blockhash: bh2,
                    lastValidBlockHeight: lv2
                }, 'confirmed');

                if (confirmation.value.err) {
                    throw new Error('Transaction failed on-chain: ' + JSON.stringify(confirmation.value.err));
                }

                const mindReceived = (qd.quote.outAmount / 1e9 * 0.99).toFixed(2);
                setStatus('success',
                    `Swap successful! ~${mindReceived} MIND received.<br>` +
                    `<a href="https://solscan.io/tx/${swapSig}" target="_blank">View on Solscan ↗</a>`
                );
                btn.innerHTML = 'Swap SOL → MIND';
                btn.disabled = false;

                // Refresh balance
                const newBal = await connection.getBalance(pubkey);
                document.getElementById('sol-balance').textContent = `Balance: ${(newBal / 1e9).toFixed(4)} SOL`;

            } catch (e) {
                console.error('Swap error:', e);
                setStatus('error', e.message || 'Swap failed. Try again.');
                btn.innerHTML = 'Swap SOL → MIND';
                btn.disabled = false;
            }
        }

        // Fix FluxBeam transaction: increase CU and fix signature buffer
        function fixFluxBeamTx(txBuf) {
            const buf = new Uint8Array(txBuf);

            // 1. Increase compute budget from 50k to 400k
            for (let i = 0; i < buf.length - 5; i++) {
                if (buf[i] === 0x02 && buf[i+1] === 0x50 && buf[i+2] === 0xC3 && buf[i+3] === 0x00 && buf[i+4] === 0x00) {
                    const newLimit = 400000;
                    buf[i+1] = newLimit & 0xFF;
                    buf[i+2] = (newLimit >> 8) & 0xFF;
                    buf[i+3] = (newLimit >> 16) & 0xFF;
                    buf[i+4] = (newLimit >> 24) & 0xFF;
                    break;
                }
            }

            // 2. Rebuild with correct signature slots
            const msgStart = 1; // skip leading 0x00
            const numRequired = buf[msgStart]; // from message header
            const newBuf = new Uint8Array(1 + numRequired * 64 + buf.length - msgStart);
            newBuf[0] = numRequired;
            // Zero-fill signature slots (already zeroed by default)
            // Copy message after signatures
            newBuf.set(buf.subarray(msgStart), 1 + numRequired * 64);

            return newBuf;
        }

        // Create Associated Token Account instruction (idempotent)
        function createATAInstruction(payer, ata, owner, mint) {
            const keys = [
                { pubkey: payer, isSigner: true, isWritable: true },
                { pubkey: ata, isSigner: false, isWritable: true },
                { pubkey: owner, isSigner: false, isWritable: false },
                { pubkey: new solanaWeb3.PublicKey(mint), isSigner: false, isWritable: false },
                { pubkey: solanaWeb3.SystemProgram.programId, isSigner: false, isWritable: false },
                { pubkey: new solanaWeb3.PublicKey(TOKEN_PROGRAM), isSigner: false, isWritable: false },
            ];
            // CreateIdempotent = instruction index 1
            return new solanaWeb3.TransactionInstruction({
                keys,
                programId: new solanaWeb3.PublicKey(ASSOC_TOKEN_PROGRAM),
                data: new Uint8Array([1]),
            });
        }

        // SyncNative instruction
        function syncNativeInstruction(account) {
            return new solanaWeb3.TransactionInstruction({
                keys: [{ pubkey: account, isSigner: false, isWritable: true }],
                programId: new solanaWeb3.PublicKey(TOKEN_PROGRAM),
                data: new Uint8Array([17]), // SyncNative = 17
            });
        }

        init();
    </script>
